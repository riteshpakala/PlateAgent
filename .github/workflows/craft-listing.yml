# Craft Agents: tells the store about every push, so it reads this repository
# again and updates the listing made from it: README.md (the description),
# Assets/listing.json (its name, tagline, category, keywords), Assets/icon.png,
# and the commit Craft installs. Added by https://craft.rao.nyc/store. No secret is kept
# here: GitHub's own token says which repository and commit. Deleting this
# file leaves the listing as it stands.
name: Craft Agents listing

on:
  push:
    branches: ['main']
    tags: ['*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: craft-agents-listing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the listing
        env:
          STORE: 'https://craft.rao.nyc'
          SYNC: 'https://api.rao.nyc/functions/v1/github/listings/sync'
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$STORE" | jq -r .value)
          curl -sS --fail-with-body -X POST "$SYNC" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"schema":1}'
